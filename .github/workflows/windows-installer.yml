name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --group build

      - name: Run tests
        run: uv run pytest -q

      - name: Read version from pyproject.toml
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build griphook.exe
        run: uv run pyinstaller packaging/griphook.spec --noconfirm --distpath dist --workpath build

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          .\dist\griphook\griphook.exe --help
          # Must fail cleanly (exit 2) with no configuration present, not crash.
          .\dist\griphook\griphook.exe test-connection
          if ($LASTEXITCODE -ne 2) { throw "expected exit code 2, got $LASTEXITCODE" }

      # Optional: set the repository variable ODBC_MSI_URL to the Microsoft
      # download link for msodbcsql18 (x64 .msi) and the installer will bundle
      # it, so machines without the driver are fixed during setup. Without it,
      # the installer detects the missing driver and explains what to ask IT for.
      - name: Download the ODBC driver MSI
        if: vars.ODBC_MSI_URL != ''
        shell: pwsh
        run: Invoke-WebRequest -Uri "${{ vars.ODBC_MSI_URL }}" -OutFile packaging\msodbcsql18.msi

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            packaging\griphook.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Griphook-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
